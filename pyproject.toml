[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cantill-spend-pipeline"
version = "1.0.0"
description = "Config-driven procurement spend normalization, deduplication and taxonomy classification"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "rapidfuzz>=3.0",
  "joblib>=1.3"
]

[project.scripts]
spend-pipeline = "spend_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["spend_pipeline*"]
